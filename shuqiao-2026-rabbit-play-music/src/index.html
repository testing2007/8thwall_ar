<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Rabbit Melody AR</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050505;
    }

    #camerafeed {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    #template-start-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: end center;
      padding: 0 24px max(64px, calc(env(safe-area-inset-bottom) + 40px));
      background:
        linear-gradient(180deg, rgba(5, 4, 2, 0.02) 48%, rgba(5, 4, 2, 0.72) 100%),
        url("./assets/poster.jpg") center center / cover no-repeat;
    }

    #template-start-screen.is-hidden {
      display: none;
    }

    #template-start-button {
      min-width: min(260px, 82vw);
      min-height: 56px;
      padding: 14px 32px;
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 999px;
      background: linear-gradient(135deg, #ffe29a, #e8a72c);
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.52);
      color: #2b1905;
      cursor: pointer;
      font: inherit;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.03em;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #template-start-button:active {
      transform: translateY(1px);
    }

    #template-start-button:disabled {
      cursor: progress;
      opacity: 0.72;
    }

    #scan-status {
      position: fixed;
      top: max(20px, calc(env(safe-area-inset-top) + 12px));
      left: 50%;
      z-index: 100;
      max-width: calc(100vw - 40px);
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      background: rgba(5, 5, 5, 0.68);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      opacity: 0;
      pointer-events: none;
      text-align: center;
      transform: translate(-50%, -10px);
      transition: opacity 180ms ease, transform 180ms ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #scan-status.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #target-video {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script src="./external/xrextras/xrextras.js"></script>
  <script src="./external/landing-page/landing-page.js"></script>
</head>

<body>
  <div id="template-start-screen">
    <button id="template-start-button" type="button" aria-label="Start augmented reality">Start AR</button>
  </div>
  <div id="scan-status" role="status" aria-live="polite">Point your camera at the artwork.</div>
  <video
    id="target-video"
    muted
    playsinline
    webkit-playsinline
    preload="none"
    crossorigin="anonymous"
    src="./assets/effect.mp4"
  ></video>
  <canvas id="camerafeed"></canvas>
  <script src="bundle.js"></script>
</body>

</html>

<!doctype html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>A-Frame: Image Targets Example</title>
  <!-- <script crossorigin="anonymous" src="./external/scripts/8frame-1.5.0.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous"
    data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous"></script> -->

  <!-- 1. 先加载 8-Frame 和 XR 核心依赖 -->
  <script src="./external/scripts/8frame-1.5.0.min.js"></script>
  <script src="./external/xrextras/xrextras.js"></script>
  <script src="./external/landing-page/landing-page.js"></script>
  <script src="./external/runtime/runtime.js"></script>
  <script>
    // Restore window.THREE to A-Frame's THREE instance to avoid conflicts with multiple Three.js instances
    if (window.AFRAME && window.AFRAME.THREE) {
      window.THREE = window.AFRAME.THREE;
    }
  </script>
  <script async src="./external/xr/xr.js" data-preload-chunks="slam"></script>
  <!-- <style>
    /* 前置摄像头画面水平镜像翻转，让画面更自然 */
    canvas.camerafeed {
      transform: scaleX(-1);
    }
  </style> -->

</head>

<body>
  <script src="bundle.js"></script>

  <!-- mirroredDisplay: true -->
  <a-scene xrconfig="cameraDirection: front; allowedDevices: any; " xrextras-gesture-detector landing-page
    xrextras-loading xrextras-runtime-error renderer="colorManagement:true;" xrweb="
    disableWorldTracking: true;">
    <a-assets>
      <a-asset-item id="bean-glb" src="assets/Models/beans.glb"></a-asset-item>
      <a-asset-item id="blades-glb" src="assets/Models/blades.glb"></a-asset-item>
      <a-asset-item id="words-glb" src="assets/Models/purrfect-brew-text.glb"></a-asset-item>
      <img id="logo" src="assets/Media/coffee-cat-transparent.png">

      <video id="wine-label-video" autoplay muted crossorigin="anonymous" loop="true"
        src="assets/Media/wine-label-video.mp4">
      </video>

      <a-asset-item id="jelly-glb" src="assets/jellyfish-model.glb"></a-asset-item>
      <img id="jelly-thumb" src="assets/video-target.jpg">
      <video id="jelly-video" autoplay muted crossorigin="anonymous" loop="true" src="assets/jellyfish-video.mp4">
      </video>
    </a-assets>

    <a-camera position="0 4 10" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;">
    </a-camera>

    <a-light type="directional" intensity="0.5" position="1 1 1"></a-light>

    <a-light type="ambient" intensity="1"></a-light>

    <!-- WINE LABEL (Cylindrical): video fades in on label -->
    <xrextras-named-image-target name="wine-label">
      <xrextras-target-video-fade video="#wine-label-video"></xrextras-target-video-fade>
    </xrextras-named-image-target>

    <!-- COFFEE SLEEVE (Conical): 3D models inside and outside container -->
    <xrextras-named-image-target name="coffee-cat">
      <!-- <xrextras-curved-target-container color="#000"></xrextras-curved-target-container> -->
      <xrextras-target-mesh width="0.8" material="src: #logo; transparent: true;"></xrextras-target-mesh>
      <a-entity gltf-model="#bean-glb" position="0 -0.5 0" scale="0.5 0.5 0.5" xrextras-spin></a-entity>
      <a-entity gltf-model="#blades-glb" position="0 -0.45 0" scale="0.13 0.13 0.13"
        xrextras-spin="speed: 1000"></a-entity>
      <a-entity gltf-model="#words-glb" position="0 -0.25 0" scale="0.2 0.2 0.2"
        xrextras-spin="speed: 5000; direction: reverse;"></a-entity>
    </xrextras-named-image-target>

    <!-- Note: "name:" must be set to the name of the image target -->
    <xrextras-named-image-target name="video-target">
      <a-entity xrextras-play-video="video: #jelly-video; thumb: #jelly-thumb; canstop: true"
        geometry="primitive: plane; height: 1; width: 0.79;"></a-entity>
    </xrextras-named-image-target>

    <!-- Note: "name:" must be set to the name of the image target  -->
    <xrextras-named-image-target name="model-target">
      <a-entity xrextras-one-finger-rotate gltf-model="#jelly-glb"></a-entity>
    </xrextras-named-image-target>

  </a-scene>



</body>

</html>

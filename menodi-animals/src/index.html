<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>MENODI Animals</title>
  <link rel="preload" as="image" href="./assets/poster.jpg">

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05040a;
    }

    #camerafeed {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    body.ar-camera-hidden #camerafeed {
      visibility: hidden;
    }

    #ar-intro-screen {
      position: fixed;
      inset: 0;
      z-index: 2147482000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 24px calc(42px + env(safe-area-inset-bottom));
      visibility: hidden;
      opacity: 0;
      background-color: #090712;
      background-image:
        linear-gradient(180deg, transparent 48%, rgba(6, 4, 13, 0.28) 65%, rgba(6, 4, 13, 0.9) 100%),
        url("./assets/poster.jpg");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      transition: opacity 240ms ease;
    }

    #ar-intro-screen.is-visible {
      visibility: visible;
      opacity: 1;
    }

    #ar-start-button {
      width: min(100%, 360px);
      min-height: 58px;
      border: 1px solid rgba(255, 238, 183, 0.7);
      border-radius: 999px;
      background: linear-gradient(135deg, #ffe28a, #e7ac35);
      box-shadow: 0 12px 38px rgba(0, 0, 0, 0.38), 0 0 28px rgba(246, 191, 68, 0.22);
      color: #241402;
      cursor: pointer;
      font: inherit;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.08em;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #ar-start-button:active {
      transform: translateY(1px) scale(0.995);
    }

    #ar-start-button:disabled {
      cursor: progress;
      opacity: 0.74;
    }

    @media (min-width: 700px) {
      #ar-intro-screen {
        background-size: contain;
      }
    }
  </style>

  <script src="./external/xrextras/xrextras.js"></script>
  <script src="./external/landing-page/landing-page.js"></script>
</head>

<body class="ar-camera-hidden">
  <canvas id="camerafeed"></canvas>

  <section id="ar-intro-screen" aria-label="MENODI AR 体验封面">
    <button id="ar-start-button" type="button">开启AR体验</button>
  </section>

  <script src="bundle.js"></script>
</body>

</html>

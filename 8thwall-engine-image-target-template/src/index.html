<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>8th Wall Engine Image Target</title>
  <meta itemprop="name" content="8th Wall Engine Image Target">
  <meta name="twitter:title" content="8th Wall Engine Image Target">
  <meta property="og:title" content="8th Wall Engine Image Target">
  <meta property="og:site_name" content="8th Wall Engine Image Target">
  <meta name="description" content="Scan target.png to show christmas.glb.">
  <meta itemprop="description" content="Scan target.png to show christmas.glb.">
  <meta property="og:description" content="Scan target.png to show christmas.glb.">
  <meta name="twitter:description" content="Scan target.png to show christmas.glb.">
  <meta property="og:image" content="assets/target.png">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #camerafeed {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    #template-start-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      background: #101118;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #template-start-screen.is-hidden {
      display: none;
    }

    #template-start-button {
      min-width: 180px;
      min-height: 48px;
      border: 0;
      border-radius: 999px;
      background: #f4c542;
      color: #101118;
      cursor: pointer;
      font: inherit;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
      touch-action: manipulation;
    }

    #template-start-button:disabled {
      cursor: progress;
      opacity: 0.72;
    }
  </style>

  <script src="./external/xrextras/xrextras.js"></script>
  <script src="./external/landing-page/landing-page.js"></script>
</head>

<body>
  <div id="template-start-screen">
    <button id="template-start-button" type="button">Start AR</button>
  </div>
  <canvas id="camerafeed"></canvas>
  <script src="bundle.js"></script>
</body>

</html>

<!doctype html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>A-Frame: Image Targets Example</title>

  <script src="./external/scripts/8frame-1.5.0.min.js"></script>
  <script src="./external/xrextras/xrextras.js"></script>
  <script src="./external/landing-page/landing-page.js"></script>
  <script src="./external/runtime/runtime.js"></script>
  <style>
    #audio-start-button {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 100000;
      transform: translateX(-50%);
      min-width: 150px;
      border: 0;
      border-radius: 8px;
      padding: 14px 20px;
      color: #fff;
      background: #111;
      font: 600 17px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #audio-start-button.hidden {
      display: none;
    }
  </style>
  <script>
    if (window.AFRAME && window.AFRAME.THREE) {
      window.THREE = window.AFRAME.THREE;
    }

    function setupTargetVideoAudioUnlock() {
      var video = document.getElementById('wine-label-video')
      var button = document.getElementById('audio-start-button')
      if (!video || !button || video.dataset.audioUnlockReady) {
        return
      }

      video.dataset.audioUnlockReady = 'true'
      video.muted = false
      video.defaultMuted = false
      video.volume = 1
      video.playsInline = true
      video.setAttribute('playsinline', '')
      video.setAttribute('webkit-playsinline', '')

      button.addEventListener('click', function () {
        video.muted = false
        video.defaultMuted = false
        video.volume = 1

        var playPromise = video.play()
        if (playPromise && playPromise.then) {
          playPromise.then(function () {
            video.pause()
            video.currentTime = 0
            video.dataset.audioUnlocked = 'true'
            button.classList.add('hidden')
            console.log('AR video audio unlocked.')
          }).catch(function (error) {
            button.textContent = 'Tap Again'
            console.warn('AR video audio unlock failed.', error)
          })
        } else {
          video.dataset.audioUnlocked = 'true'
          button.classList.add('hidden')
        }
      })
    }
  </script>
  <!-- xr.js: no data-preload-chunks, slam not needed (disableWorldTracking: true) -->
  <script async src="./external/xr/xr.js"></script>
</head>

<body>
  <script src="bundle.js?v=20260718-target-fix"></script>
  <button id="audio-start-button" type="button">Start Audio</button>

  <a-scene xrconfig="cameraDirection: back; allowedDevices: any; " xrextras-gesture-detector landing-page
    xrextras-loading xrextras-runtime-error renderer="colorManagement:true;" xrweb="
    disableWorldTracking: true;">
    <a-assets timeout="5000">
      <video id="wine-label-video" muted playsinline webkit-playsinline preload="none" crossorigin="anonymous"
        loop="true" src="assets/Media/introduce.mp4?v=20260718-target-fix">
      </video>
    </a-assets>
    <script>
      setupTargetVideoAudioUnlock()
    </script>

    <a-camera position="0 4 10" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;">
    </a-camera>

    <a-light type="directional" intensity="0.5" position="1 1 1"></a-light>
    <a-light type="ambient" intensity="1"></a-light>

    <xrextras-named-image-target name="barone-56-label">
      <xrextras-target-video-fade video="#wine-label-video"></xrextras-target-video-fade>
    </xrextras-named-image-target>
    <!-- <xrextras-named-image-target name="cat-label">
      <xrextras-target-video-fade video="#wine-label-video"></xrextras-target-video-fade>
    </xrextras-named-image-target>
    <xrextras-named-image-target name="barone-castello-label">
      <xrextras-target-video-fade video="#wine-label-video"></xrextras-target-video-fade>
    </xrextras-named-image-target> -->
  </a-scene>
</body>

</html>
